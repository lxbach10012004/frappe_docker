apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket
  namespace: erpnext
spec:
  replicas: 1
  selector:
    matchLabels:
      app: websocket
  template:
    metadata:
      labels:
        app: websocket
    spec:
      containers:
      - name: websocket
        image: frappe/erpnext:v15.55.0
        command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
        envFrom:
        - configMapRef:
            name: erpnext-config
        volumeMounts:
        - name: sites
          mountPath: /home/frappe/frappe-bench/sites
        - name: logs
          mountPath: /home/frappe/frappe-bench/logs
      volumes:
      - name: sites
        persistentVolumeClaim:
          claimName: sites-pvc
      - name: logs
        persistentVolumeClaim:
          claimName: logs-pvc