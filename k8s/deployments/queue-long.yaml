apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-long
  namespace: erpnext
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queue-long
  template:
    metadata:
      labels:
        app: queue-long
    spec:
      containers:
      - name: queue-long
        image: frappe/erpnext:v15.55.0
        command: ["bench", "worker", "--queue", "long,default,short"]
        envFrom:
        - configMapRef:
            name: erpnext-config
        volumeMounts:
        - name: sites
          mountPath: /home/frappe/frappe-bench/sites
        - name: logs
          mountPath: /home/frappe/frappe-bench/logs
      volumes:
      - name: sites
        persistentVolumeClaim:
          claimName: sites-pvc
      - name: logs
        persistentVolumeClaim:
          claimName: logs-pvc