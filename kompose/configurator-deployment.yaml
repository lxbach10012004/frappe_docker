apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f pwd.yml
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: configurator
  name: configurator
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: configurator
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f pwd.yml
        kompose.version: 1.35.0 (9532ceef3)
      labels:
        io.kompose.service: configurator
    spec:
      containers:
        - args:
            - |
              ls -1 apps > sites/apps.txt; bench set-config -g db_host $(DB)_HOST; bench set-config -gp db_port $(DB)_PORT; bench set-config -g redis_cache "redis://$(REDIS)_CACHE"; bench set-config -g redis_queue "redis://$(REDIS)_QUEUE"; bench set-config -g redis_socketio "redis://$(REDIS)_QUEUE"; bench set-config -gp socketio_port $(SOCKETIO)_PORT;
          command:
            - bash
            - -c
          env:
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "3306"
            - name: REDIS_CACHE
              value: redis-cache:6379
            - name: REDIS_QUEUE
              value: redis-queue:6379
            - name: SOCKETIO_PORT
              value: "9000"
          image: frappe/erpnext:v15.55.0
          name: configurator
          volumeMounts:
            - mountPath: /home/frappe/frappe-bench/sites
              name: sites
            - mountPath: /home/frappe/frappe-bench/logs
              name: logs
          # resources:
          #   requests:
          #     memory: "512Mi"     
          #     cpu: "500m"        
          #   limits:
          #     memory: "1Gi"       
          #     cpu: "1"
      restartPolicy: Always
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: sites
        - name: logs
          persistentVolumeClaim:
            claimName: logs
